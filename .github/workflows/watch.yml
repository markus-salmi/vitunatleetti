name: Watch atleetti.fi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: atleetti-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for new posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: python telegrambot.py --once

      - name: Remember what we sent
        run: |
          if [ -n "$(git status --porcelain seen_posts.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_posts.json
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "no new posts, nothing to commit"
          fi
